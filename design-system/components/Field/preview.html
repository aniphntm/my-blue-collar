<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Field - preview</title></head>
<body>
<div id="root" class="mb-stage"></div>
<script>
  var M = window.MyBlue, h = React.createElement;

  var app = h('div', { style: { maxWidth: 440, display: 'grid', gap: 10 } },
    h(M.Field, { label: 'Your name', name: 'name', required: true, autoComplete: 'name' }),
    h(M.Field, { label: 'Email', name: 'email', type: 'email', required: true, autoComplete: 'email', hint: 'We write once, when a beta spot opens near you.' }),
    h(M.Field, { label: 'Primary trade', name: 'trade', required: true, placeholder: 'Choose a trade', options: ['Electrical', 'HVAC', 'Plumbing', 'Roofing', 'Flooring', 'Landscaping', 'Painting', 'Remodeling', 'Other'] }),
    h(M.Field, { label: 'Phone', name: 'phone', type: 'tel', autoComplete: 'tel', defaultValue: '555-01', error: 'Enter a 10-digit phone number, like 555-010-0123.' }));
  ReactDOM.createRoot(document.getElementById('root')).render(app);
</script>
</body>
</html>
